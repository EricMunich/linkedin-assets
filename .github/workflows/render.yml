name: Render post images

on:
  push:
    branches: [main]
    paths:
      - "posts/**/*.html"
      - "render.py"
      - ".github/workflows/render.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install fonts and Playwright
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core > /dev/null
          pip install -q playwright==1.47.0
          python -m playwright install --with-deps chromium
      - name: Render
        run: python render.py
      - name: Commit results
        run: |
          git config user.name "render-bot"
          git config user.email "render-bot@users.noreply.github.com"
          git add -A posts
          if git diff --cached --quiet; then
            echo "Keine neuen Dateien."
          else
            git commit -m "Render: $(git diff --cached --name-only | grep -E '\.(png|pdf)$' | tr '\n' ' ')"
            git push
          fi
